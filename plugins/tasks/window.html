<style>
  /* Окно «Дела» (t1159) — макет spikes\t1156-tasks-mockup2\mockup.html. Цвета — переменные тем (renderer\theme.css). */
  :root { --line: rgba(var(--muted-rgb),.16); --hlk: 20%; }

  .val:focus-within { outline: 1px solid var(--focus); }
  .val.today, .val.today input { color: var(--accent); } .val.late, .val.late input { color: var(--danger); }
  .val .pp { display: flex; align-items: center; gap: 3px; padding: 2px 6px; border-radius: 4px; color: var(--muted); font-size: 12px; cursor: pointer; }
  .val .pp:hover { background: var(--selected); } .val .pp.on { background: var(--selected); color: var(--text); font-weight: 600; }
  .val .pp.q1 { color: var(--danger); } .val .pp.q2 { color: var(--warn); } .val .pp.q3 { color: var(--info); }
  .val .add { margin-left: auto; color: var(--accent); display: grid; place-items: center; width: 22px; height: 22px; border-radius: 4px; }
  .val .add:hover { background: var(--selected); }
  .val .one { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 4px; }
  .val .one:hover { background: var(--selected); }
  .val .dim { color: var(--faint); font-size: 12px; }
  .sws { display: flex; flex-wrap: wrap; gap: 5px; margin: -4px 0 12px; }
  .sws i, .pal i { width: 18px; height: 18px; border-radius: 50%; display: block; cursor: pointer; position: relative; }
  .sws i.on, .pal i.on { outline: 2px solid var(--text); outline-offset: 2px; }
  .sws i.none { border: 1.5px dashed var(--faint); box-sizing: border-box; }
  i.own { background: conic-gradient(#E5484D, #D99A1E, #2FA86A, #2B9FD9, #7A6FF0, #DB4B9C, #E5484D); }
  i.own input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; padding: 0; border: 0; }
  .sw { width: 14px; height: 14px; border-radius: 4px; flex: none; }
  .tog { margin-left: auto; width: 30px; height: 17px; border-radius: 9px; background: var(--raised); position: relative; flex: none; cursor: pointer; }
  .tog::after { content: ""; position: absolute; left: 2px; top: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--muted); transition: left .12s; }
  .tog.on { background: var(--accent); } .tog.on::after { left: 15px; background: var(--button-fg); }
  .tog.off { opacity: .4; cursor: default; }
  #pick { position: fixed; z-index: 12; width: 390px; max-width: calc(100vw - 16px); background: var(--menu); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 14px 40px rgba(0,0,0,.45); padding: 12px; }
  #pick .q { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--input); margin-bottom: 10px; color: var(--text); }
  #pick .q:focus-within { border-color: var(--focus); }
  #pick .q svg { color: var(--muted); }
  #pick .q input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); font: inherit; padding: 0; }
  #pick .q input::placeholder { color: var(--faint); }
  #pick .q small { font-size: 11px; color: var(--muted); }
  #pick .lab { font-size: 11.5px; color: var(--muted); margin: 8px 0 6px; }
  #pick .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; max-height: 148px; overflow-y: auto; }
  #pick .grid div { height: 32px; border-radius: 6px; display: grid; place-items: center; color: var(--text); cursor: pointer; }
  #pick .grid div:hover { background: var(--hover); }
  #pick .grid div.on { background: var(--selected); outline: 1.5px solid var(--focus); outline-offset: -1.5px; }
  #pick .grid .none { grid-column: 1 / -1; height: auto; padding: 8px 0; color: var(--muted); font-size: 12px; cursor: default; }
  #pick .pal { display: flex; gap: 5px; flex-wrap: wrap; }
  #pick .pal i { width: 22px; height: 22px; }
  .chosen { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .chosen b { display: flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: 5px; background: var(--hover); font-weight: 400; color: var(--text); cursor: pointer; }
  .chosen b.on { outline: 1.5px solid var(--focus); }
  .chosen b .rm { color: var(--faint); margin-left: 2px; } .chosen b:hover .rm { color: var(--danger); }
  .chosen .hint { margin-left: auto; }
  @media (max-width: 700px) {
    #dlg { flex-direction: column; overflow-y: auto; }
    .dl { overflow: visible; flex: none; }
    .dr { width: auto; border-left: 0; border-top: 1px solid var(--line); overflow: visible; flex: none; }
  }
  /* Узкое окно (панель 330 px): без левой колонки; в строке — иконки и счётчик ветки, как правая часть макета. */
  @media (max-width: 640px) {
    aside { display: none; }
    main { padding: 10px 12px 0; }
    main h1 { font-size: 17px; }
    .meta .due, .meta .tcard, .meta .tlab { display: none; }
  }
</style>
