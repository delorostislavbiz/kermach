<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Kermach — Дашборд</title>
<link rel="stylesheet" href="../../renderer/theme.css">
<script src="../../renderer/theme.js"></script>
<script src="../../renderer/i18n.js"></script>
<style>
  /* Окно «Дашборд» (t1472, МАКЕТ-дашборд.html): сводка, полосы по состоянию сверху вниз, в полосе — сетка карточек. Цвета — переменные тем. */
  :root { --line: rgba(var(--muted-rgb),.16); --c-wait: var(--warn, var(--need)); --c-work: var(--ok, var(--accent)); --c-done: var(--info, var(--accent)); --c-err: var(--danger); --c-quiet: var(--faint, var(--muted)); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; user-select: none; }
  body { display: flex; flex-direction: column; }
  #title { height: 36px; display: flex; align-items: center; padding-left: 14px; flex-shrink: 0; -webkit-app-region: drag; font-size: 12px; border-bottom: 1px solid var(--line); }
  #title .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; color: var(--muted); }
  #title .btns { display: flex; height: 100%; -webkit-app-region: no-drag; }
  #title .btns div { width: 46px; display: flex; align-items: center; justify-content: center; }
  #title .btns div:hover { background: rgba(var(--muted-rgb),.14); }
  #title .btns #close:hover { background: var(--danger); color: #fff; }
  /* Прокрутка только сверху вниз: сетка сама переносит карточки по ширине. */
  #scroll { flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; padding: 14px 16px 28px; }
  .sum { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--raised, var(--side)); font-size: 12px; border: 1px solid var(--line); cursor: pointer; }
  .chip:hover { border-color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); flex-shrink: 0; }
  .wait { --c: var(--c-wait); } .work { --c: var(--c-work); } .done { --c: var(--c-done); } .quiet { --c: var(--c-quiet); } .err { --c: var(--c-err); }
  section { margin-bottom: 22px; }
  section > h2 { all: unset; display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; cursor: pointer; }
  section > h2 .n { color: var(--faint, var(--muted)); font-weight: 400; letter-spacing: 0; }
  section > h2 .tw { color: var(--faint, var(--muted)); font-size: 10px; transition: transform .15s; }
  section.shut > h2 .tw { transform: rotate(-90deg); }
  section.shut .grid { display: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 10px; }
  .card { position: relative; min-width: 0; background: var(--side); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px 10px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
  .card::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--p); }
  .card:hover { background: var(--hover); }
  .card:focus-visible, .ag:focus-visible, h2:focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
  .head { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .nm { font-weight: 600; font-size: 14px; color: var(--p); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .state { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--c); white-space: nowrap; }
  .state .t, .k { color: var(--muted); }
  .ask { background: rgba(var(--need-rgb, 236,168,85),.10); border: 1px solid rgba(var(--need-rgb, 236,168,85),.32); border-radius: 6px; padding: 6px 8px; font-size: 12px; overflow-wrap: anywhere; }
  .ask .k { color: var(--c-wait); }
  .ask q { quotes: "«" "»"; }
  code { font-family: 'Cascadia Mono', Consolas, monospace; font-size: 11.5px; }
  .said { font-size: 12.5px; }
  .said q { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; quotes: "«" "»"; overflow-wrap: anywhere; }
  .reply { font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; border-left: 2px solid var(--line); padding-left: 8px; overflow-wrap: anywhere; }
  .row { font-size: 12.5px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  .src { color: var(--faint, var(--muted)); font-size: 11px; }
  .prog { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); min-width: 0; }
  .prog .ph { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prog .track { flex: 1 0 40px; height: 4px; border-radius: 2px; background: rgba(var(--muted-rgb),.2); overflow: hidden; }
  .prog .track i { display: block; height: 100%; background: var(--p); }
  .prog b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
  .prog .src { white-space: nowrap; }
  .agents { display: flex; flex-wrap: wrap; gap: 6px; }
  .ag { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 4px; background: var(--bg); font-size: 11.5px; border: 1px solid var(--line); }
  .ag[data-sid]:hover { border-color: var(--c); }
  .ag .s { color: var(--c); }
  .ag.bg { cursor: default; }
  .foot { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--faint, var(--muted)); }
  #empty { padding: 40px 0; text-align: center; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="title">
  <div class="name" data-i18n="dashboard.title">Kermach — Дашборд</div>
  <div class="btns">
    <div id="min" title="Свернуть" data-i18n-title="common.minimize"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg></div>
    <div id="max" title="Развернуть" data-i18n-title="common.maximize"><svg width="10" height="10" viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg></div>
    <div id="close" title="Закрыть" data-i18n-title="common.close"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"/></svg></div>
  </div>
</div>
<div id="scroll"><div class="sum" id="sum"></div><div id="bands"></div></div>
<script src="page.js"></script>
</body>
</html>
